name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test -p batly
      - name: Build batly.exe
        run: cargo build --release -p batly
      - name: Build installer
        shell: pwsh
        run: |
          $env:BATLY_PAYLOAD = "$PWD\target\release\batly.exe"
          cargo build --release -p batly-setup
      - uses: actions/upload-artifact@v4
        with:
          name: batly-windows-x64
          path: |
            target/release/batly.exe
            target/release/batly-setup.exe
