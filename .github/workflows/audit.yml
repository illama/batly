name: Audit

# Known vulnerabilities (RustSec advisory database) in Cargo.lock: on every
# change of the dependencies and once a week, since new advisories come
# out for crates that did not change.

on:
  push:
    branches: [main]
    paths: ["**/Cargo.toml", "Cargo.lock", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["**/Cargo.toml", "Cargo.lock", ".github/workflows/audit.yml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit --deny warnings
