[workspace]
resolver = "2"
members = ["app", "setup"]

[workspace.package]
version = "5.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["illama", "Batly contributors"]
repository = "https://github.com/illama/batly"

[workspace.lints.clippy]
# Style only: the explicit types and chunks read better here.
type_complexity = "allow"
chunks_exact_to_as_chunks = "allow"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
