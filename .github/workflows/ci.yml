name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test -p lgstray
      - name: Build lgstray.exe
        run: cargo build --release -p lgstray
      - name: Build installer
        shell: pwsh
        run: |
          $env:LGSTRAY_PAYLOAD = "$PWD\target\release\lgstray.exe"
          cargo build --release -p lgstray-setup
      - uses: actions/upload-artifact@v4
        with:
          name: lgstray-windows-x64
          path: |
            target/release/lgstray.exe
            target/release/lgstray-setup.exe
