; LGSTray - battery levels of the LGSTray devices (reads /api/devices).
; Settings: edit the [Variables] section below, then refresh the skin.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
BackgroundMode=2
SolidColor=#Background#
ContextTitle=Open LGSTray page
ContextAction=["#Url#/"]

[Metadata]
Name=LGSTray
Author=LGSTray
Information=Battery levels of up to 4 devices, read from the local LGSTray API (http://localhost:12321/api/devices).
Version=1.0
License=GPL-3.0

[Variables]
; LGSTray address (another computer: http://name-or-ip:12321)
Url=http://localhost:12321
; Access token, only needed for another computer that has one set
Token=
; Refresh period, in seconds
Refresh=30
Width=220
FontFace=Segoe UI
FontSize=10
TextColor=235,235,235,255
MutedColor=170,170,170,255
Background=20,22,26,190
BarBack=255,255,255,40
BarColor=60,196,122,255
LowColor=239,97,97,255
; One device: an optional block of the JSON array (4 captures: id, name, percent, charging)
Item=(?(?=.*\{"id").*\{"id":"(.*)","name":"(.*)".*"battery_percent":(.*),.*"charging":(.*),.*\})

[MeasureDevices]
Measure=WebParser
URL=#Url#/api/devices?token=#Token#
UpdateRate=#Refresh#
CodePage=65001
RegExp=(?siU)^\[#Item##Item##Item##Item#
FinishAction=[!UpdateMeasureGroup Devices][!UpdateMeterGroup Rows][!Redraw]
OnConnectErrorAction=[!SetOption MeterTitle Text "LGSTray: no connection"][!UpdateMeter MeterTitle][!Redraw]

[MeterTitle]
Meter=String
X=10
Y=8
W=(#Width#-20)
FontFace=#FontFace#
FontSize=(#FontSize#-1)
FontColor=#MutedColor#
AntiAlias=1
Text=LGSTray
LeftMouseUpAction=["#Url#/"]

; ---------------------------------------------------------------- device 1
[MeasureName1]
Measure=WebParser
URL=[MeasureDevices]
StringIndex=2
Group=Devices
Substitute="é":"é","è":"è","\"":""
IfMatch=^$
IfMatchAction=[!HideMeterGroup Row1][!Redraw]
IfNotMatchAction=[!ShowMeterGroup Row1][!Redraw]

[MeasurePercent1]
Measure=WebParser
URL=[MeasureDevices]
StringIndex=3
Group=Devices
MinValue=0
MaxValue=100
Substitute="null":"0"
IfBelowValue=16
IfBelowAction=[!SetOption MeterBar1 BarColor "#LowColor#"]
IfAboveValue=15
IfAboveAction=[!SetOption MeterBar1 BarColor "#BarColor#"]

[MeasurePercentText1]
Measure=WebParser
URL=[MeasureDevices]
StringIndex=3
Group=Devices
Substitute="null":"–"

[MeasureCharging1]
Measure=WebParser
URL=[MeasureDevices]
StringIndex=4
Group=Devices
Substitute="true":" ⚡","false":""

[MeterName1]
Meter=String
MeasureName=MeasureName1
MeasureName2=MeasureCharging1
Group=Rows | Row1
X=10
Y=6R
W=(#Width#-70)
ClipString=1
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#TextColor#
AntiAlias=1
Text=%1%2

[MeterPercent1]
Meter=String
MeasureName=MeasurePercentText1
Group=Rows | Row1
X=(#Width#-10)
Y=0r
StringAlign=Right
FontFace=#FontFace#
FontSize=#FontSize#
FontColor=#TextColor#
AntiAlias=1
Text=%1 %

[MeterBar1]
Meter=Bar
MeasureName=MeasurePercent1
Group=Rows | Row1
X=10
Y=4R
W=(#Width#-20)
H=5
BarOrientation=Horizontal
BarColor=#BarColor#
SolidColor=#BarBack#
DynamicVariables=1

