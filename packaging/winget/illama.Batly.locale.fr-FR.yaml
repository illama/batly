ShortDescription: Niveau de batterie des périphériques Logitech (et autres sans-fil) dans la zone de notification de Windows.
Description: |-
  Batly affiche le niveau de batterie des souris, claviers et casques Logitech (récepteurs
  HID++, Bluetooth, G HUB) et d'autres périphériques sans fil dans la zone de notification de
  Windows, avec notifications de batterie faible et API HTTP locale. Un seul petit exécutable
  natif écrit en Rust : pas de runtime .NET, pas de processus auxiliaire. Installation par
  utilisateur, sans droits administrateur.
